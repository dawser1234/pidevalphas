<div>
    <h5>Liste des Utilisateurs</h5>
    <table class="table">
        <thead>
            <tr>
                
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Role</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let user of users">
                
                <td>{{ user.nomU }}</td>
                <td>{{ user.prenomU }}</td>
                <td>{{ user.emailU }}</td>
                <td>{{user.role}}</td>
                <td>
                    
                        <i class="fas fa-trash" (click)="deleteUser(user.idU)" style="cursor: pointer;"></i>
                        &nbsp;&nbsp;
                        <i class="fas fa-edit" (click)="openUpdateDialog(user)" style="cursor: pointer; margin-right: 10px;"></i> <!-- Icône d'édition -->
                        &nbsp;&nbsp;
                        <i class="fas fa-plus" *ngIf="user.role === 'EMPLOYE' && user.idU !== undefined" (click)="openPresenceModal(user.idU!)" style="cursor: pointer;"></i>
                    
                </td>
            </tr>
        </tbody>
    </table>
</div>
